<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4da84"/>
      <stop offset="55%" stop-color="#d1a83f"/>
      <stop offset="100%" stop-color="#a97f24"/>
    </linearGradient>
  </defs>

  <!-- compass bezel: outer ring + evenly-spaced ticks -->
  <circle cx="54" cy="54" r="27" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <g stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round">
    <line x1="54" y1="24.5" x2="54" y2="29.5"/>
    <line x1="54" y1="78.5" x2="54" y2="83.5"/>
    <line x1="24.5" y1="54" x2="29.5" y2="54"/>
    <line x1="78.5" y1="54" x2="83.5" y2="54"/>
    <line x1="34.7" y1="34.7" x2="38.2" y2="38.2"/>
    <line x1="69.8" y1="34.7" x2="66.3" y2="38.2"/>
    <line x1="34.7" y1="73.3" x2="38.2" y2="69.8"/>
    <line x1="69.8" y1="73.3" x2="66.3" y2="69.8"/>
  </g>

  <!-- sunburst rays fanning above the eye -->
  <g stroke="url(#gold)" stroke-linecap="round">
    <line x1="54" y1="45" x2="54" y2="30" stroke-width="1.8"/>
    <line x1="46.5" y1="47" x2="38" y2="35" stroke-width="1.5"/>
    <line x1="61.5" y1="47" x2="70" y2="35" stroke-width="1.5"/>
    <line x1="40.5" y1="52" x2="29" y2="46" stroke-width="1.3"/>
    <line x1="67.5" y1="52" x2="79" y2="46" stroke-width="1.3"/>
  </g>

  <!-- road: converges from the base of the icon up into the eye -->
  <path d="M39 85 L51 59 L57 59 L69 85 Z" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="54" y1="85" x2="54" y2="61" stroke="url(#gold)" stroke-width="1.4" stroke-dasharray="3.2,3.2"/>

  <!-- eye -->
  <path d="M33 55 Q54 41 75 55 Q54 69 33 55 Z" fill="#0e2954" stroke="url(#gold)" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="54" cy="55" r="7.4" fill="#1b6b52"/>
  <circle cx="54" cy="55" r="7.4" fill="none" stroke="url(#gold)" stroke-width="0.8"/>
  <circle cx="54" cy="55" r="4.6" fill="#46e6aa"/>
  <circle cx="54" cy="55" r="2" fill="#0a1a14"/>
  <circle cx="52.2" cy="53" r="1" fill="#eafff6" opacity="0.85"/>
</svg>
